<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .text { fill: #1e293b; font-family: Arial, sans-serif; font-size: 14px; }
      .title { fill: #0f172a; font-weight: bold; font-size: 16px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { fill: #64748b; font-size: 12px; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Data Flow: Event Ingestion to Delivery</text>

  <!-- Row 1: Ingestion -->
  <rect x="50" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="110" y="85" class="text" text-anchor="middle">User App</text>
  <text x="110" y="105" class="label" text-anchor="middle">POST /v1/events</text>

  <path d="M 170 90 L 220 90" class="arrow"/>

  <rect x="220" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="280" y="85" class="text" text-anchor="middle">API Gateway</text>
  <text x="280" y="105" class="label" text-anchor="middle">Auth + Validate</text>

  <path d="M 340 90 L 390 90" class="arrow"/>

  <rect x="390" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="450" y="85" class="text" text-anchor="middle">Kinesis Stream</text>
  <text x="450" y="105" class="label" text-anchor="middle">Buffer events</text>

  <path d="M 510 90 L 560 90" class="arrow"/>

  <rect x="560" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="620" y="85" class="text" text-anchor="middle">Events Consumer</text>
  <text x="620" y="105" class="label" text-anchor="middle">Lambda</text>

  <!-- Row 2: Storage -->
  <path d="M 620 120 L 620 150 L 110 150 L 110 180" class="arrow"/>
  <rect x="50" y="180" width="120" height="60" class="box" rx="5"/>
  <text x="110" y="205" class="text" text-anchor="middle">S3 Data Lake</text>
  <text x="110" y="225" class="label" text-anchor="middle">JSONL partitioned</text>

  <path d="M 620 120 L 620 150 L 710 150 L 710 180" class="arrow"/>
  <rect x="650" y="180" width="120" height="60" class="box" rx="5"/>
  <text x="710" y="205" class="text" text-anchor="middle">DynamoDB</text>
  <text x="710" y="225" class="label" text-anchor="middle">User profiles</text>

  <!-- Row 3: ML Pipeline -->
  <path d="M 110 240 L 110 270 L 280 270 L 280 290" class="arrow"/>
  <rect x="220" y="290" width="120" height="70" class="box" rx="5"/>
  <text x="280" y="315" class="text" text-anchor="middle">Glue ETL</text>
  <text x="280" y="335" class="label" text-anchor="middle">Feature eng.</text>
  <text x="280" y="350" class="label" text-anchor="middle">(nightly)</text>

  <path d="M 280 360 L 280 390 L 110 390 L 110 420" class="arrow"/>
  <rect x="50" y="420" width="120" height="70" class="box" rx="5"/>
  <text x="110" y="445" class="text" text-anchor="middle">SageMaker</text>
  <text x="110" y="465" class="label" text-anchor="middle">Train XGBoost</text>
  <text x="110" y="480" class="label" text-anchor="middle">(nightly)</text>

  <!-- Row 4: Inference & Delivery -->
  <path d="M 710 240 L 710 260 L 620 260 L 620 290" class="arrow"/>
  <rect x="560" y="290" width="120" height="60" class="box" rx="5"/>
  <text x="620" y="310" class="text" text-anchor="middle">Decision Service</text>
  <text x="620" y="325" class="label" text-anchor="middle">Find optimal</text>
  <text x="620" y="340" class="label" text-anchor="middle">send time</text>

  <path d="M 560 320 L 510 320" class="arrow"/>
  <rect x="390" y="290" width="120" height="60" class="box" rx="5"/>
  <text x="450" y="310" class="text" text-anchor="middle">EventBridge</text>
  <text x="450" y="325" class="label" text-anchor="middle">Schedule</text>
  <text x="450" y="340" class="label" text-anchor="middle">delivery</text>

  <path d="M 450 350 L 450 380 L 280 380 L 280 420" class="arrow"/>
  <rect x="220" y="420" width="120" height="60" class="box" rx="5"/>
  <text x="280" y="440" class="text" text-anchor="middle">Sender Service</text>
  <text x="280" y="455" class="label" text-anchor="middle">Send email/</text>
  <text x="280" y="470" class="label" text-anchor="middle">SMS/push</text>

  <!-- Legend -->
  <text x="50" y="560" class="label">Blue boxes: AWS Services</text>
  <text x="50" y="578" class="label">Arrows: Data flow direction</text>
</svg>
