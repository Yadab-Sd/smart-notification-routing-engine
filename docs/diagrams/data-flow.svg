<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
      .text { fill: #1e293b; font-family: Arial, sans-serif; font-size: 14px; }
      .title { fill: #0f172a; font-weight: bold; font-size: 16px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { fill: #64748b; font-size: 12px; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Data Flow: Event Ingestion to Delivery</text>

  <!-- Row 1: Ingestion -->
  <rect x="50" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="110" y="85" class="text" text-anchor="middle">User App</text>
  <text x="110" y="105" class="label" text-anchor="middle">POST /v1/events</text>

  <path d="M 170 90 L 220 90" class="arrow"/>

  <rect x="220" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="280" y="85" class="text" text-anchor="middle">API Gateway</text>
  <text x="280" y="105" class="label" text-anchor="middle">Auth + Validate</text>

  <path d="M 340 90 L 390 90" class="arrow"/>

  <rect x="390" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="450" y="85" class="text" text-anchor="middle">Kinesis Stream</text>
  <text x="450" y="105" class="label" text-anchor="middle">Buffer events</text>

  <path d="M 510 90 L 560 90" class="arrow"/>

  <rect x="560" y="60" width="120" height="60" class="box" rx="5"/>
  <text x="620" y="85" class="text" text-anchor="middle">Events Consumer</text>
  <text x="620" y="105" class="label" text-anchor="middle">Lambda</text>

  <!-- Row 2: Storage (Fixed positioning - no overlap) -->
  <path d="M 620 120 L 620 150 L 530 150 L 530 180" class="arrow"/>
  <rect x="470" y="180" width="120" height="60" class="box" rx="5"/>
  <text x="530" y="205" class="text" text-anchor="middle">S3 Data Lake</text>
  <text x="530" y="225" class="label" text-anchor="middle">JSONL partitioned</text>

  <path d="M 620 120 L 620 150 L 710 150 L 710 180" class="arrow"/>
  <rect x="650" y="180" width="120" height="60" class="box" rx="5"/>
  <text x="710" y="205" class="text" text-anchor="middle">DynamoDB</text>
  <text x="710" y="225" class="label" text-anchor="middle">User profiles</text>

  <!-- Row 3: ML Pipeline -->
  <path d="M 530 240 L 530 270 L 450 270 L 450 300" class="arrow"/>
  <rect x="390" y="300" width="120" height="70" class="box" rx="5"/>
  <text x="450" y="325" class="text" text-anchor="middle">Glue ETL</text>
  <text x="450" y="345" class="label" text-anchor="middle">Feature eng.</text>
  <text x="450" y="360" class="label" text-anchor="middle">(nightly)</text>

  <path d="M 390 335 L 270 335" class="arrow"/>
  <rect x="150" y="300" width="120" height="70" class="box" rx="5"/>
  <text x="210" y="325" class="text" text-anchor="middle">SageMaker</text>
  <text x="210" y="345" class="label" text-anchor="middle">Train XGBoost</text>
  <text x="210" y="360" class="label" text-anchor="middle">(nightly)</text>

  <!-- Row 4: Inference & Delivery -->
  <path d="M 210 240 L 210 270 L 110 270 L 110 180" class="arrow"/>
  <rect x="50" y="180" width="120" height="60" class="box" rx="5"/>
  <text x="110" y="200" class="text" text-anchor="middle">Decision Service</text>
  <text x="110" y="215" class="label" text-anchor="middle">Find optimal</text>
  <text x="110" y="230" class="label" text-anchor="middle">send time</text>

  <path d="M 170 210 L 220 210" class="arrow"/>
  <rect x="220" y="180" width="120" height="60" class="box" rx="5"/>
  <text x="280" y="200" class="text" text-anchor="middle">EventBridge</text>
  <text x="280" y="215" class="label" text-anchor="middle">Schedule</text>
  <text x="280" y="230" class="label" text-anchor="middle">delivery</text>

  <path d="M 340 210 L 370 210" class="arrow"/>
  <rect x="370" y="180" width="120" height="60" class="box" rx="5"/>
  <text x="430" y="200" class="text" text-anchor="middle">Sender Service</text>
  <text x="430" y="215" class="label" text-anchor="middle">Send email/</text>
  <text x="430" y="230" class="label" text-anchor="middle">SMS/push</text>

  <!-- Legend -->
  <text x="50" y="420" class="label">Blue boxes: AWS Services</text>
  <text x="50" y="438" class="label">Arrows: Data flow direction</text>
</svg>
