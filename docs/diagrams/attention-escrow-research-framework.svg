<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">Attention Escrow Research Framework</title>
  <desc id="desc">Research-level diagram of the Smart Notification Routing Engine Attention Escrow decision model, showing contextual inputs, send-time utility, attention cost, value estimation, policy gate, decision outcomes, audit ledger, and feedback loop.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 16; }
      .panel-soft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 14; }
      .panel-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.3; rx: 14; }
      .panel-green { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.3; rx: 14; }
      .panel-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 1.3; rx: 14; }
      .panel-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.3; rx: 14; }
      .panel-purple { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.3; rx: 14; }
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .h1 { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .h2 { font: 700 14px Arial, Helvetica, sans-serif; fill: #1e293b; }
      .text { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, Helvetica, sans-serif; fill: #475569; }
      .mono { font: 500 12px "SFMono-Regular", Consolas, monospace; fill: #1e293b; }
      .mono-big { font: 600 15px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .label { font: 700 11px Arial, Helvetica, sans-serif; fill: #475569; letter-spacing: .08em; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowSoft); }
      .feedback { stroke: #0f766e; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrowGreen); }
      .decision-line { stroke: #7c3aed; stroke-width: 2; fill: none; marker-end: url(#arrowPurple); }
      .danger-line { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1020"/>

  <text class="title" x="800" y="46" text-anchor="middle">Attention Escrow as a Trust-Aware Notification Decision Framework</text>
  <text class="subtitle" x="800" y="74" text-anchor="middle">A second-stage gate that decides whether predicted engagement is worth spending user attention.</text>

  <rect class="panel-soft" x="42" y="108" width="1516" height="72"/>
  <text class="label" x="70" y="134">RESEARCH OBJECTIVE</text>
  <text class="text" x="70" y="158">Optimize notification delivery by jointly modeling temporal utility, interruption cost, trust, urgency, and organizational value while preserving auditable explanations.</text>

  <!-- Input strata -->
  <rect class="panel" x="58" y="225" width="290" height="282"/>
  <text class="h1" x="84" y="258">1. Contextual State Vector</text>
  <text class="small" x="84" y="282">Observed at decision time t for user u and message m</text>
  <rect class="panel-blue" x="84" y="306" width="226" height="54"/>
  <text class="h2" x="104" y="328">User state</text>
  <text class="small" x="104" y="348">sends, clicks, fatigue, preferences</text>
  <rect class="panel-blue" x="84" y="372" width="226" height="54"/>
  <text class="h2" x="104" y="394">Message state</text>
  <text class="small" x="104" y="414">category, priority, urgency, value</text>
  <rect class="panel-blue" x="84" y="438" width="226" height="54"/>
  <text class="h2" x="104" y="460">Source state</text>
  <text class="small" x="104" y="480">campaign/source trust and history</text>

  <!-- Temporal utility -->
  <rect class="panel" x="410" y="224" width="315" height="282"/>
  <text class="h1" x="438" y="258">2. Temporal Utility Model</text>
  <text class="small" x="438" y="282">Send-time optimization over candidate hour buckets</text>
  <rect class="panel-green" x="438" y="310" width="250" height="76"/>
  <text class="h2" x="458" y="334">Current implementation</text>
  <text class="mono" x="458" y="356">p_engage = f(hour, click_rate, volume)</text>
  <text class="small" x="458" y="374">SageMaker endpoint or fallback heuristic</text>
  <rect class="panel-soft" x="438" y="408" width="250" height="72"/>
  <text class="h2" x="458" y="432">Output</text>
  <text class="mono" x="458" y="454">bestHour, p_best, sendNowProbability</text>
  <text class="small" x="458" y="472">Temporal opportunity score, not final send decision</text>

  <!-- Attention valuation -->
  <rect class="panel" x="792" y="194" width="420" height="344"/>
  <text class="h1" x="826" y="228">3. Attention Cost and Value Estimation</text>
  <text class="small" x="826" y="252">Transparent scoring layer for explainable MVP and future ML replacement</text>
  <rect class="panel-orange" x="828" y="280" width="348" height="90"/>
  <text class="h2" x="850" y="304">Attention cost</text>
  <text class="mono" x="850" y="328">C = 1 + 3F + 2(1 - T) + Ch + CatPenalty</text>
  <text class="small" x="850" y="350">F = fatigue score, T = source trust, Ch = channel cost</text>
  <rect class="panel-green" x="828" y="392" width="348" height="90"/>
  <text class="h2" x="850" y="416">Attention value</text>
  <text class="mono" x="850" y="440">V = 6p_best + 2U + 2B + PriorityBoost</text>
  <text class="small" x="850" y="462">U = urgency, B = normalized business value</text>
  <line x1="1002" y1="286" x2="1002" y2="482" stroke="#cbd5e1" stroke-width="1"/>
  <text class="label" x="1002" y="516" text-anchor="middle">COST-VALUE TRADEOFF</text>

  <!-- Gate -->
  <rect class="panel-purple" x="1280" y="234" width="250" height="244"/>
  <text class="h1" x="1310" y="268">4. Escrow Gate</text>
  <text class="small" x="1310" y="292">Policy-aware thresholding</text>
  <rect class="panel" x="1310" y="318" width="188" height="88"/>
  <text class="mono-big" x="1328" y="346">if bypass: SEND</text>
  <text class="mono-big" x="1328" y="372">else if V &gt;= C + M:</text>
  <text class="mono-big" x="1364" y="396">SEND</text>
  <text class="mono-big" x="1328" y="424">else: DEFER</text>
  <text class="small" x="1310" y="456">M is larger for low-priority marketing messages.</text>

  <!-- Decision outcomes -->
  <rect class="panel-green" x="1035" y="610" width="210" height="94"/>
  <text class="h1" x="1062" y="642">SEND</text>
  <text class="small" x="1062" y="664">Schedule or send now</text>
  <text class="small" x="1062" y="684">Preserve decision metadata</text>
  <rect class="panel-red" x="1288" y="610" width="210" height="94"/>
  <text class="h1" x="1314" y="642">DEFER</text>
  <text class="small" x="1314" y="664">Avoid low-value interruption</text>
  <text class="small" x="1314" y="684">Explain reason to operator</text>

  <!-- Ledger and measurement -->
  <rect class="panel" x="480" y="640" width="410" height="220"/>
  <text class="h1" x="514" y="674">5. Auditable Attention Ledger</text>
  <text class="small" x="514" y="698">Persistent evidence for decisions and later learning</text>
  <rect class="panel-soft" x="514" y="724" width="330" height="96"/>
  <text class="mono" x="536" y="748">ATTENTION_DECISION:</text>
  <text class="small" x="536" y="770">decisionId, userId, sourceId, categoryId</text>
  <text class="small" x="536" y="790">C, V, F, T, p_best, reason, policy fields</text>
  <text class="mono" x="536" y="812">ATTENTION_DELIVERY:</text>
  <text class="small" x="536" y="834">SENT / FAILED linked to decisionId</text>

  <rect class="panel" x="76" y="650" width="300" height="206"/>
  <text class="h1" x="108" y="684">6. Outcome Signals</text>
  <text class="small" x="108" y="708">Measured now or planned for richer research evaluation</text>
  <text class="text" x="108" y="742">Positive: click, conversion, reply, helpful action</text>
  <text class="text" x="108" y="770">Negative: unsubscribe, complaint, bounce, mute</text>
  <text class="text" x="108" y="798">Censored: delivered but no trackable action</text>
  <text class="small" x="108" y="830">Important: missing click is not treated as proof of user harm.</text>

  <!-- Research extension -->
  <rect class="panel-soft" x="950" y="810" width="542" height="118"/>
  <text class="label" x="980" y="842">RESEARCH EXTENSION</text>
  <text class="text" x="980" y="866">Replace or calibrate the rule-based gate with a learned risk model:</text>
  <text class="mono" x="980" y="892">P(negative_or_wasted_attention | user, source, category, hour, channel, history)</text>
  <text class="small" x="980" y="916">Final action remains policy constrained and explainable: SEND, DEFER, DIGEST, SUPPRESS.</text>

  <!-- Arrows -->
  <path class="arrow" d="M348 365 C374 365 384 365 410 365"/>
  <path class="arrow" d="M725 365 C752 365 765 365 792 365"/>
  <path class="arrow" d="M1212 365 C1240 365 1252 365 1280 365"/>
  <path class="decision-line" d="M1405 478 L1405 560 C1405 584 1370 588 1240 615"/>
  <path class="danger-line" d="M1430 478 L1430 560 C1430 586 1444 592 1444 610"/>
  <path class="arrow-soft" d="M1035 657 C960 657 935 690 890 730"/>
  <path class="arrow-soft" d="M1288 657 C1126 657 1004 690 890 730"/>
  <path class="feedback" d="M76 745 C34 745 34 160 210 160 C350 160 432 200 525 224"/>
  <path class="feedback" d="M376 742 C430 742 442 742 480 742"/>
  <path class="feedback" d="M685 860 C685 952 250 952 218 856"/>

  <!-- Claim boundary -->
  <rect class="panel-soft" x="58" y="930" width="1460" height="54"/>
  <text class="label" x="84" y="954">CLAIM BOUNDARY FOR PUBLICATION</text>
  <text class="small" x="84" y="974">This figure represents the proposed and implemented framework. Empirical claims such as accuracy, ROI, or fatigue reduction require controlled pilot data and should be reported only after validation.</text>
</svg>
