name: Deploy Frontend to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'infra/cdk/lib/frontend-stack.ts'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-west-2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Get CloudFormation outputs
        id: cfn-outputs
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name SR-Frontend \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name SR-Frontend \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)

          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

          echo "✅ S3 Bucket: $BUCKET_NAME"
          echo "✅ CloudFront Distribution: $DIST_ID"

      - name: Upload to S3
        working-directory: frontend/dist
        run: |
          aws s3 sync . s3://${{ steps.cfn-outputs.outputs.bucket_name }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.map"

          # Upload index.html separately with no-cache
          aws s3 cp index.html s3://${{ steps.cfn-outputs.outputs.bucket_name }}/index.html \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"

          echo "✅ Files uploaded to S3"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn-outputs.outputs.distribution_id }} \
            --paths "/*" \
          | jq -r '.Invalidation.Id' > invalidation-id.txt

          INVALIDATION_ID=$(cat invalidation-id.txt)
          echo "✅ CloudFront invalidation created: $INVALIDATION_ID"

      - name: Wait for invalidation completion
        run: |
          INVALIDATION_ID=$(cat invalidation-id.txt)
          echo "⏳ Waiting for invalidation to complete..."

          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.cfn-outputs.outputs.distribution_id }} \
            --id $INVALIDATION_ID

          echo "✅ CloudFront cache invalidated"

      - name: Deployment summary
        run: |
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks --stack-name SR-Frontend \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" --output text)

          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL**: $CLOUDFRONT_URL" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket**: ${{ steps.cfn-outputs.outputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**CloudFront Distribution**: ${{ steps.cfn-outputs.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
